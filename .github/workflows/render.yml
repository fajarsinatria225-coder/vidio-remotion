name: Render Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-22.04
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependency
        run: npm install

      - name: Install library untuk Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
            libgbm-dev libcups2 libatk-bridge2.0-0

      - name: Render video
        run: npx remotion render src/index.ts Promo out/promo.mp4

      - name: Upload hasil
        uses: actions/upload-artifact@v4
        with:
          name: video-promo
          path: out/promo.mp4
